[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-concept-web-scraper"
version = "0.1.0"
description = "Local-first daily security digest CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Security Digest Contributors"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
security-digest = "security_digest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_digest = ["fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
